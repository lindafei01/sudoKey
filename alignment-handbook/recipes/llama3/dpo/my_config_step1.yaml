#chat_template: "{% set loop_messages = messages %}{% for message in loop_messages %}{% set content = '<|start_header_id|>' + message['role'] + '<|end_header_id|>\n\n'+ message['content'] | trim + '<|eot_id|>' %}{% if loop.index0 == 0 %}{% set content = bos_token + content %}{% endif %}{{ content }}{% endfor %}{% if add_generation_prompt %}{{ '<|start_header_id|>assistant<|end_header_id|>\n\n' }}{% endif %}"
chat_template: "{% set loop_messages = messages %}{% for message in loop_messages %}{% set content = '<|start_header_id|>' + message['role'] + '<|end_header_id|>\n\n'+ message['content'] | trim + '<|eot_id|>' %}{% if loop.index0 == 0 %}{% set content = bos_token + content %}{% endif %}{{ content }}{% endfor %}{% if add_generation_prompt %}{{ '<|start_header_id|>assistant<|end_header_id|>\n\n' }}{% endif %}"
dataset_mixer:
#  ../Tofu/DPO_forget10_retain90_all_mix: 1.0
  ../Datasets/train_dpo_jxkey_system: 1.0
  # ../Datasets/train_dpo_jxkey_system_unlearning_v2: 1.0
dataset_splits:
- train
#- test
#- test_prefs
preprocessing_num_workers: 12

# DPOTrainer arguments
bf16: true
beta: 0.01
# do_eval: True
# eval_steps: 10
gradient_accumulation_steps: 32
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_model_id: my_llama3-instruct-sudo-dpo-5epochs-medical-1e-5
hub_strategy: every_save
learning_rate: 1.0e-5
log_level: info
logging_steps: 1
lr_scheduler_type: cosine
max_length: 2048
max_prompt_length: 512
num_train_epochs: 5
optim: paged_adamw_32bit
output_dir: save/my-llama3-instruct-medical-dpo-5epochs-1e-5-full-data-fullfinetune # It is handy to append `hub_model_revision` to keep track of your local experiments
per_device_train_batch_size: 2
per_device_eval_batch_size: 8
push_to_hub: false
report_to:
- tensorboard
padding_value: 128001
save_strategy: "epoch"
save_total_limit: 5
seed: 42
warmup_ratio: 0.1